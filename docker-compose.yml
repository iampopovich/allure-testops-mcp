version: '3.8'

services:
  allure-testops-mcp:
    build: .
    container_name: allure-testops-mcp
    environment:
      - ALLURE_TESTOPS_URL=${ALLURE_TESTOPS_URL:?set ALLURE_TESTOPS_URL in .env}
      - ALLURE_TOKEN=${ALLURE_TOKEN}
      - ALLURE_PROJECT_ID=${ALLURE_PROJECT_ID:-}
    restart: unless-stopped
    stdin_open: true
    tty: true
